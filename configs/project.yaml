project:
  name: gold-policy-colombia-biplot-umap
  country: Colombia
  asset: gold

data:
  raw_path: data/raw/BD_Energía_Colombia.xlsx
  sheet_name: Hoja1
  date_column: fecha
  target_column: precio_oro
  feature_columns:
    - demanda_energetica
    - trm
    - tipm
    - precio_brent
    - precio_cafe_centusd
    - dtf
    - bancolombia_price_usd
    - inflacion_sin_alimentos
    - precio_bolsa_nacional_energetica

analysis:
  methods:
    - local_biplot
    - umap
    - difference_in_differences
    - decision_trees
    - grey_box_models
  frequency: monthly
  target: precio_oro
  n_clusters: 4
  random_state: 42
  umap:
    n_neighbors: 12
    min_dist: 0.15
    metric: euclidean
  did:
    event_window: 6
    policy_change_quantile: 0.75

supervised:
  frequency: monthly
  horizons: [1, 3, 6]
  lags: [1, 2, 3, 6, 12]
  rolling_windows: [3, 6, 12]
  train_size: 0.8
  include_umap_context: true
  umap_context_path: data/processed/policy_umap_embedding.csv
  random_forest:
    n_estimators: 500
    max_depth:
    min_samples_leaf: 3
    random_state: 42
  decision_tree:
    max_depth: 4
    min_samples_leaf: 5
    random_state: 42
  grey_box:
    alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
    theory_features:
      - trm
      - tipm
      - dtf
      - precio_brent
      - inflacion_sin_alimentos
      - precio_bolsa_nacional_energetica

policy:
  rate_column: tipm
  executive_periods:
    - name: pastrana
      start: "1998-08-07"
      end: "2002-08-06"
    - name: uribe_i
      start: "2002-08-07"
      end: "2006-08-06"
    - name: uribe_ii
      start: "2006-08-07"
      end: "2010-08-06"
    - name: santos_i
      start: "2010-08-07"
      end: "2014-08-06"
    - name: santos_ii
      start: "2014-08-07"
      end: "2018-08-06"
    - name: duque
      start: "2018-08-07"
      end: "2022-08-06"
    - name: petro
      start: "2022-08-07"
      end: "2026-08-06"
