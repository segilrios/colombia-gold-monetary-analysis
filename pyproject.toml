[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-policy-colombia-biplot-umap"
version = "0.1.0"
description = "UMAP, local biplot, clustering and DiD scaffolding for gold prices and monetary policy in Colombia."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "umap-learn>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]
